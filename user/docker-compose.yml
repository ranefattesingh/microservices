services:
  user:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: user-service
    working_dir: /app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - .:/app
    environment:
      USER_SERVICE_SERVER__HOST: "0.0.0.0"
      USER_SERVICE_SERVER__PORT: "8080"
      USER_SERVICE_DATABASE__HOST: "postgres"
      USER_SERVICE_DATABASE__PORT: "5432"
      USER_SERVICE_DATABASE__USER: "test"
      USER_SERVICE_DATABASE__PASSWORD: "test1234"
      USER_SERVICE_DATABASE__DATABASE: "users"
      USER_SERVICE_DATABASE__SSLMODE: "disable"
    command: air -c .air.toml

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: