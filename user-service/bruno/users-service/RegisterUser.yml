info:
  name: RegisterUser
  type: http

http:
  method: POST
  url: http://localhost:8000/users/register
  body:
    type: json
    data: |-
      {
        "email": "myemail",
        "password": "mypassword",
        "confirmPassword": "confirmPassword"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
