name: AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 2    # Optimized: Grabs just enough local depth context to parse the PR delta layers

      - name: Set up Environment Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: pip install google-genai

      - name: Run Secured AI Audit Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.github_token }} # Scoped repository token usage
        run: python .github/scripts/review.py
